<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alsaif TV Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<style>
:root{
  color-scheme: dark;
  --bg:#0A0E13; --panel:#111720; --raised:#18202B; --line:#222C39; --hover:#1F2935;
  --text:#E6ECF2; --dim:#8794A3; --faint:#5B6776;
  --accent:#2E7DFF; --accent-soft:rgba(46,125,255,.16); --accent-text:#9CC3FF;
  --live:#FF4D4F; --ok:#39C07F; --warn:#F2B84B;
  --radius:10px;
  --display:'Readex Pro', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --body:'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--body);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{box-shadow:0 0 0 3px var(--accent);border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- app shell ---------- */
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;padding-inline:20px;gap:12px;padding-block:14px 0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:700 20px/1 var(--display);letter-spacing:.2px}
.brand .mark{width:30px;height:22px;border-radius:5px;background:var(--accent);display:grid;place-items:center}
.brand .mark::after{content:"";border-inline-start:9px solid #fff;border-block:6px solid transparent;margin-inline-start:2px;transform:scaleX(-1)}
.server-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:var(--raised);color:var(--text);max-width:260px}
.server-btn .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.server-btn .t{font-size:11px;color:var(--dim);background:var(--panel);padding:2px 6px;border-radius:4px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;background:var(--raised);white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#1f6ef0}
.btn.ghost{background:transparent;color:var(--dim)}
.btn.ghost:hover{color:var(--text);background:var(--raised)}
.btn.small{padding:6px 10px;font-size:13px}
.searchbar{display:flex;align-items:center;gap:10px;min-width:220px;padding:9px 14px;border-radius:8px;background:var(--raised);color:var(--dim)}
.searchbar:hover{background:var(--hover);color:var(--text)}
.searchbar kbd{margin-inline-start:auto;font:12px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{padding:10px 16px;color:var(--dim);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
.tab .count{font-size:12px;color:var(--faint);margin-inline-start:4px}

.main{display:grid;grid-template-columns:250px 1fr;gap:20px;min-height:0}
.cats{overflow:auto;padding-block:4px 20px;padding-inline-end:4px;display:flex;flex-direction:column;gap:2px}
.cat{display:flex;align-items:center;gap:8px;text-align:start;padding:9px 12px;border-radius:8px;color:var(--dim)}
.cat:hover{background:var(--panel);color:var(--text)}
.cat[aria-current="true"]{background:var(--accent-soft);color:var(--accent-text)}
.cat .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .ct{font-size:12px;color:var(--faint)}
.cat-sep{height:1px;background:var(--line);margin:8px 4px}

.content{display:flex;flex-direction:column;min-height:0;min-width:0}
.content-head{display:flex;align-items:baseline;gap:12px;padding-block:2px 12px;flex-wrap:wrap}
.content-head h2{margin:0;font:600 19px/1.3 var(--display);text-wrap:balance}
.content-head .meta{color:var(--faint);font-size:13px}
.sortsel{margin-inline-start:auto;background:var(--raised);border:0;border-radius:8px;padding:7px 10px;color:var(--text)}
.scroll{overflow:auto;min-height:0;padding-bottom:28px}

/* channel rows */
.rows{display:flex;flex-direction:column;gap:2px}
.row{position:relative;display:grid;grid-template-columns:44px 64px 1fr auto;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;text-align:start}
.row:hover,.row:focus-visible{background:var(--panel)}
.row .no{color:var(--faint);font-size:13px;text-align:center}
.row .lg{width:64px;height:40px;border-radius:6px;object-fit:contain;background:var(--raised)}
.row .tt{min-width:0}
.row .tt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tt small{display:block;color:var(--dim);font-size:12px}
.more{width:32px;height:32px;border-radius:8px;color:var(--dim);display:grid;place-items:center;font-size:18px;line-height:1}
.more:hover{background:var(--raised);color:var(--text)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}

/* poster grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;text-align:start;border-radius:var(--radius)}
.card .ps{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:var(--radius);overflow:hidden;background:var(--raised);transition:transform .15s}
.card .ps img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover .ps,.card:focus-visible .ps{transform:translateY(-3px)}
.card:focus-visible{box-shadow:none}
.card:focus-visible .ps{box-shadow:0 0 0 3px var(--accent)}
.card .ps .bar{position:absolute;inset-inline:0;bottom:0;margin:0;border-radius:0;height:4px;background:rgba(0,0,0,.5)}
.card b{font-weight:500;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--dim);font-size:12px}
.card .more{position:absolute;top:6px;inset-inline-end:6px;background:rgba(10,14,19,.7);opacity:0;transition:opacity .15s}
.card:hover .more,.card .more:focus-visible{opacity:1}
.badge{display:inline-block;font:500 11px/1 var(--mono);padding:3px 5px;border-radius:4px;background:var(--raised);color:var(--dim)}
.badge.live{background:var(--live);color:#fff}

.empty{padding:60px 20px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--text);font:600 17px var(--display);margin-bottom:6px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{margin:30px auto;max-width:560px;padding:18px 20px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);line-height:1.7}
.errbox b{color:var(--warn);display:block;margin-bottom:4px}

/* ---------- overlays ---------- */
.layer{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.layer-head{display:flex;align-items:center;gap:10px;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px))}

/* search */
.search-input{flex:1;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:18px;color:var(--text)}
.search-input:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-inline:20px}
.chip{padding:6px 12px;border-radius:999px;background:var(--raised);color:var(--dim);font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.search-status{padding:10px 20px 0;color:var(--faint);font-size:13px}
.search-body{flex:1;overflow:auto;padding:10px 20px 30px}

/* details */
.details{overflow:auto}
.dt-back{position:absolute;inset:0 0 auto 0;height:70vh;background-size:cover;background-position:center;filter:blur(30px) saturate(1.2);opacity:.28;transform:scale(1.2);pointer-events:none}
.dt-back::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,var(--bg))}
.dt-wrap{position:relative;padding:8px 20px 40px;max-width:1100px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.dt-top{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:start}
.dt-poster{width:200px;max-width:100%;aspect-ratio:2/3;border-radius:12px;object-fit:cover;background:var(--raised);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.dt-top h1{margin:0 0 6px;font:700 32px/1.2 var(--display);text-wrap:balance}
.dt-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--dim);font-size:14px;margin-bottom:12px}
.dt-meta span+span::before{content:"•";margin-inline-end:8px;color:var(--faint)}
.dt-plot{max-width:65ch;margin:0 0 12px;line-height:1.8}
.dt-people{color:var(--dim);font-size:13px;margin:0 0 16px;max-width:70ch}
.dt-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dt-progress{max-width:340px;margin-bottom:14px}
.dt-progress small{color:var(--dim);font-size:12px}
.seasons{display:flex;gap:6px;flex-wrap:wrap}
.ep{display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:center;padding:8px;border-radius:10px;text-align:start}
.ep:hover,.ep:focus-visible{background:var(--panel)}
.ep img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--raised)}
.ep b{font-weight:500}
.ep small{color:var(--dim);font-size:12px;display:block}
.eplist{display:flex;flex-direction:column;gap:2px}
.section-title{font:600 16px var(--display);margin:0 0 10px}

/* ---------- player ---------- */
.player{position:fixed;inset:0;z-index:40;background:#000;color:#fff;overflow:hidden}
.player video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.player video::cue{font-size:var(--cue,1.6rem);background:rgba(0,0,0,.55);color:#fff;font-family:var(--body)}
.p-top,.p-bottom{position:absolute;inset-inline:0;padding:16px 22px;display:flex;align-items:center;gap:10px;transition:opacity .25s}
.p-top{top:0;background:linear-gradient(rgba(0,0,0,.8),transparent);padding-top:calc(16px + env(safe-area-inset-top,0px))}
.p-bottom{bottom:0;flex-direction:column;align-items:stretch;background:linear-gradient(transparent,rgba(0,0,0,.85));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.player.idle .p-top,.player.idle .p-bottom{opacity:0;pointer-events:none}
.player.idle{cursor:none}
.p-title{flex:1;min-width:0}
.p-title b{display:block;font:600 18px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-title small{color:rgba(255,255,255,.7);font-size:12px}
.pbtn{height:40px;min-width:40px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.1);color:#fff;font-size:14px}
.pbtn:hover{background:rgba(255,255,255,.2)}
.pbtn.icon{padding:0;font-size:18px}
.p-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-time{font:500 13px var(--mono);color:rgba(255,255,255,.85);min-width:110px;text-align:center}
.seek{width:100%;accent-color:var(--accent);height:18px;direction:ltr}
.livepill{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);letter-spacing:.8px;padding:4px 8px;border-radius:4px;background:var(--live)}
.livepill::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.p-osd{position:absolute;top:84px;inset-inline-start:28px;padding:10px 16px;border-radius:10px;background:rgba(0,0,0,.72);font:500 20px var(--display);transition:opacity .3s;pointer-events:none;max-width:70%}
.p-osd .ch{font-family:var(--mono);color:var(--accent-text);margin-inline-end:10px}
.p-center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.p-center .spinner{margin:0}
.p-error{pointer-events:auto;max-width:520px;margin:20px;padding:18px 22px;border-radius:12px;background:rgba(17,23,32,.94);line-height:1.8;text-align:center}
.p-error b{display:block;font:600 17px var(--display);margin-bottom:6px;color:var(--warn)}

.sheet{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(400px,100%);background:rgba(12,16,22,.96);backdrop-filter:blur(10px);display:flex;flex-direction:column;z-index:3;box-shadow:0 0 40px rgba(0,0,0,.6)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:16px 18px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid rgba(255,255,255,.08)}
.sheet-head h3{flex:1;margin:0;font:600 17px var(--display)}
.sheet-body{flex:1;overflow:auto;padding:8px 10px 20px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:8px;text-align:start;color:#fff}
.opt:hover,.opt:focus-visible{background:rgba(255,255,255,.08)}
.opt .k{flex:1}
.opt .v{color:var(--accent-text);font-size:13px}
.opt[aria-checked="true"]::after{content:"✓";color:var(--accent-text);font-weight:700}
.opt-note{padding:8px 12px 12px;color:rgba(255,255,255,.6);font-size:13px;line-height:1.6}
.opt-group{padding:14px 12px 6px;color:rgba(255,255,255,.45);font-size:12px;letter-spacing:.4px}
.li{display:grid;grid-template-columns:34px 48px 1fr;gap:10px;align-items:center;width:100%;padding:8px;border-radius:8px;text-align:start;color:#fff}
.li:hover,.li:focus-visible{background:rgba(255,255,255,.08)}
.li[aria-current="true"]{background:var(--accent-soft)}
.li[aria-current="true"] .nm::before{content:"▶ ";color:var(--accent-text)}
.li img{width:48px;height:32px;object-fit:cover;border-radius:4px;background:#222}
.li .no{font:12px var(--mono);color:rgba(255,255,255,.5);text-align:center}
.li .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .bar{margin-top:4px;background:rgba(255,255,255,.12)}

/* ---------- dialogs, menus, toast ---------- */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.modal{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.modal h3{margin:0 0 14px;font:600 19px var(--display)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--dim)}
.field input{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 12px;direction:ltr;text-align:left}
.field input:focus{border-color:var(--accent)}
.seg{display:flex;gap:4px;background:var(--raised);padding:4px;border-radius:9px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 10px;border-radius:6px;color:var(--dim);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.srv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px}
.srv:hover{background:var(--raised)}
.srv[aria-current="true"]{background:var(--accent-soft)}
.srv .grow{flex:1;min-width:0;text-align:start}
.srv .grow b{display:block;font-weight:500}
.srv .grow small{color:var(--dim);font-size:12px}
.row-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.note{font-size:13px;color:var(--dim);line-height:1.7;background:var(--raised);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.menu{position:fixed;z-index:70;min-width:230px;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:start;padding:10px 12px;border-radius:6px}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.toast{position:fixed;z-index:80;width:max-content;max-width:calc(100% - 32px);bottom:calc(24px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.help{color:var(--faint);font-size:12px;padding:6px 0 14px}

/* ---------- phone width ---------- */
@media (max-width:760px){
  .app{padding-inline:16px;gap:10px}
  .top .spacer{display:none}
  .searchbar{order:3;flex:1 1 100%;min-width:0;white-space:nowrap}
  .searchbar kbd{display:none}
  .server-btn{flex:1;min-width:0}
  .main{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:10px}
  .cats{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:0 0 6px}
  .cat{flex:none;background:var(--panel)}
  .cat-sep{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px 10px}
  .row{grid-template-columns:30px 52px 1fr auto;gap:8px}
  .row .lg{width:52px;height:34px}
  .dt-top{grid-template-columns:1fr}
  .dt-poster{width:150px}
  .dt-top h1{font-size:25px}
  .ep{grid-template-columns:96px 1fr auto}
  .ep img{width:96px}
  .p-time{min-width:0}
  .p-osd{top:70px;inset-inline-start:16px;font-size:17px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span>Alsaif</div>
    <button class="server-btn" id="serverBtn" title="السيرفرات"><span class="n" id="serverName"></span><span class="t" id="serverType"></span><span aria-hidden="true">▾</span></button>
    <div class="spacer"></div>
    <button class="searchbar" id="searchBtn"><span aria-hidden="true">⌕</span><span>بحث شامل بكل السيرفر</span><kbd>/</kbd></button>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="main">
    <aside class="cats" id="cats" aria-label="التصنيفات"></aside>
    <section class="content">
      <div class="content-head">
        <h2 id="catTitle"></h2><span class="meta" id="catMeta"></span>
        <select class="sortsel" id="sortSel" aria-label="الترتيب">
          <option value="0">ترتيب السيرفر</option>
          <option value="1">الأحدث إضافة</option>
          <option value="2">الاسم (أ-ي)</option>
          <option value="3">الأعلى تقييماً</option>
          <option value="4">الأحدث سنةً</option>
        </select>
      </div>
      <div class="scroll" id="items"></div>
    </section>
  </div>
</div>

<!-- search -->
<div class="layer" id="search" hidden>
  <div class="layer-head">
    <button class="btn ghost" data-close="search" aria-label="رجوع">→</button>
    <input class="search-input" id="q" type="search" placeholder="ابحث عن قناة، فيلم أو مسلسل…" autocomplete="off">
  </div>
  <div class="chips" id="qFilters">
    <button class="chip" data-k="" aria-pressed="true">الكل</button>
    <button class="chip" data-k="live" aria-pressed="false">مباشر</button>
    <button class="chip" data-k="movie" aria-pressed="false">أفلام</button>
    <button class="chip" data-k="series" aria-pressed="false">مسلسلات</button>
  </div>
  <div class="search-status" id="qStatus"></div>
  <div class="search-body" id="qResults"></div>
</div>

<!-- details -->
<div class="layer details" id="details" hidden></div>

<!-- player -->
<div class="player" id="player" hidden>
  <video id="video" playsinline></video>
  <div class="p-center" id="pCenter"></div>
  <div class="p-top">
    <button class="pbtn icon" id="pClose" aria-label="رجوع">→</button>
    <div class="p-title"><b id="pTitle"></b><small id="pSub"></small></div>
    <button class="pbtn" id="pListBtn">☰ <span id="pListLbl">الحلقات</span></button>
    <button class="pbtn" id="pSetBtn">⚙ الإعدادات</button>
  </div>
  <div class="p-osd" id="pOsd" hidden></div>
  <div class="p-bottom">
    <input class="seek" id="pSeek" type="range" min="0" max="1000" value="0" aria-label="التقدّم">
    <div class="p-controls">

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}

  get(k, d) { try { const v = localStorage.getItem('tvp:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },

/* =========================================================
   Network — explains browser blocks in plain words
   ========================================================= */
async function getText(url) {
  let r;
  try { r = await fetch(url); }
  catch (e) {
    const httpFromHttps = location.protocol === 'https:' && /^http:/i.test(url);
    throw new Error(httpFromHttps
      ? 'المتصفح منع الاتصال لأنه السيرفر http والصفحة https. افتح الملف من جهازك مباشرة (file://) أو استخدم تطبيق الأندرويد.'
      : 'المتصفح منع الاتصال بالسيرفر. أغلب سيرفرات IPTV ما بتسمح للمتصفحات تتصل فيها (CORS). تطبيق الأندرويد بيشتغل معها عادي.');
  }
  if (!r.ok) throw new Error('السيرفر رد بخطأ HTTP ' + r.status);
  return r.text();
}
async function getJson(url) {
  const t = await getText(url);

}

/* =========================================================
   M3U parser (same rules as the Android app)
   ========================================================= */
function guessKind(url) {
  const l = url.toLowerCase().split('?')[0];
  if (l.includes('/movie/')) return 'movie';
  if (l.includes('/series/')) return 'episode';
  if (/\.(mp4|mkv|avi|mov|webm|m4v)$/.test(l)) return 'movie';
  return 'live';
}
function parseM3U(text) {
  const out = []; let title = null, attrs = {}, grp = null;
  for (let line of text.split(/\r?\n/)) {
    line = line.trim().replace(/^﻿/, '');
    if (!line) continue;
    if (/^#EXTINF/i.test(line)) {
      attrs = {}; for (const m of line.matchAll(/([A-Za-z0-9_-]+)\s*=\s*"([^"]*)"/g)) attrs[m[1].toLowerCase()] = m[2];
      let q = false; title = null;
      for (let i = 0; i < line.length; i++) { if (line[i] === '"') q = !q; else if (line[i] === ',' && !q) { title = line.slice(i + 1).trim(); break; } }
    } else if (/^#EXTGRP:/i.test(line)) grp = line.slice(8).trim();
    else if (line.startsWith('#')) continue;
    else {
      const url = line.split('|')[0];
      out.push({
        id: 'm' + out.length, url, kind: guessKind(url),
        name: title || attrs['tvg-name'] || 'قناة ' + (out.length + 1),
        logo: attrs['tvg-logo'] || null,
        group: attrs['group-title'] || grp || 'بدون تصنيف',
      });
      title = null; attrs = {}; grp = null;
    }
  }
  return out;
}

function Xtream(srv) {
  let base = srv.url.trim();
  if (!/^https?:\/\//i.test(base)) base = 'http://' + base;
  base = base.replace(/^https:\/\/([^\/?#]+):80(?=[\/?#]|$)/i, 'http://$1:80');
  base = base.split('?')[0].replace(/\/+$/, '').replace(/\/(player_api|get|xmltv|panel_api)\.php$/i, '');
  const u = srv.user, p = srv.pass, fmt = srv.fmt || 'm3u8';
  const api = (a, extra = '') => `${base}/player_api.php?username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}${a ? '&action=' + a : ''}${extra}`;
  const arr = j => Array.isArray(j) ? j : (j && typeof j === 'object' ? Object.values(j) : []);
  const s = v => v == null ? '' : String(v);
  const rating = r => { const d = parseFloat(r); return d > 0 ? d.toFixed(1) : ''; };
  const acts = { live: ['get_live_categories', 'get_live_streams'], movie: ['get_vod_categories', 'get_vod_streams'], series: ['get_series_categories', 'get_series'] };
  const backdrop = i => Array.isArray(i.backdrop_path) ? i.backdrop_path[0] : (i.backdrop_path || null);
  return {
    type: 'xtream', hasDetails: true, hasSections: true,
    async login() { const j = await getJson(api()); if (s(j?.user_info?.auth) !== '1') throw new Error('اسم المستخدم أو كلمة المرور غلط'); return j.user_info; },
    async categories(sec) { return arr(await getJson(api(acts[sec][0]))).map(c => ({ id: s(c.category_id), name: s(c.category_name) || '—' })); },
    async items(sec, cat) {
      const list = arr(await getJson(api(acts[sec][1], cat ? '&category_id=' + encodeURIComponent(cat) : '')));
      return list.map(o => {
        if (sec === 'live') { const id = s(o.stream_id), other = fmt === 'ts' ? 'm3u8' : 'ts';
          return { id, kind: 'live', name: s(o.name), logo: o.stream_icon || null, group: s(o.category_id), url: `${base}/live/${u}/${p}/${id}.${fmt}`, fallback: `${base}/live/${u}/${p}/${id}.${other}`, added: +o.added || 0 }; }
        if (sec === 'movie') { const id = s(o.stream_id);
          return { id, kind: 'movie', name: s(o.name), logo: o.stream_icon || null, group: s(o.category_id), url: `${base}/movie/${u}/${p}/${id}.${o.container_extension || 'mp4'}`, rating: rating(o.rating), added: +o.added || 0, year: s(o.year) }; }
        return { id: s(o.series_id), kind: 'series', name: s(o.name), logo: o.cover || null, group: s(o.category_id), url: '', rating: rating(o.rating), added: +o.last_modified || 0, year: s(o.year || o.releaseDate || o.release_date).slice(0, 4) };
      }).filter(x => x.id);
    },
    async vodInfo(it) {
      const j = await getJson(api('get_vod_info', '&vod_id=' + encodeURIComponent(it.id))); const i = (j && !Array.isArray(j.info) && j.info) || {};
      return { title: s(i.name) || it.name, poster: i.movie_image || i.cover_big || it.logo, backdrop: backdrop(i), plot: s(i.plot || i.description), genre: s(i.genre), cast: s(i.cast || i.actors), director: s(i.director), release: s(i.releasedate || i.release_date), rating: rating(i.rating), duration: s(i.duration) };
    },
    async seriesInfo(it) {
      const j = await getJson(api('get_series_info', '&series_id=' + encodeURIComponent(it.id))); const i = (j && !Array.isArray(j.info) && j.info) || {};
      const details = { title: s(i.name) || it.name, poster: i.cover || it.logo, backdrop: backdrop(i), plot: s(i.plot), genre: s(i.genre), cast: s(i.cast), director: s(i.director), release: s(i.releaseDate || i.release_date), rating: rating(i.rating) };
      let raw = [];
      const e = j && j.episodes;
      if (Array.isArray(e)) e.forEach(x => Array.isArray(x) ? raw.push(...x) : raw.push(x));
      else if (e) Object.keys(e).sort((a, b) => a - b).forEach(k => raw.push(...arr(e[k])));
      const eps = raw.filter(x => x && x.id).map(x => ({
        id: s(x.id), kind: 'episode', group: s(x.season) || '1', seriesId: it.id, seriesName: details.title,
        name: `S${s(x.season) || 1} E${s(x.episode_num)} • ${s(x.title)}`,

        url: `${base}/series/${u}/${p}/${s(x.id)}.${x.container_extension || 'mp4'}`,
      }));
      eps.sort((a, b) => (+a.group - +b.group) || ((+(a.name.match(/E(\d+)/) || [])[1] || 0) - (+(b.name.match(/E(\d+)/) || [])[1] || 0)));

    },
  };
}

function M3U(srv) {

  return {

    async categories() { const l = await load(); const g = new Map(); l.forEach(x => g.set(x.group, (g.get(x.group) || 0) + 1)); return [...g].map(([k, n]) => ({ id: k, name: k, count: n })); },
    async items(sec, cat) { const l = await load(); return cat ? l.filter(x => x.group === cat) : l; },
  };
}
function Direct(srv) {
  const item = { id: 'd', name: srv.name, url: srv.url, kind: guessKind(srv.url), group: 'd', logo: logo('▶', 215) };

/* =========================================================
   Search across the whole server
   ========================================================= */
const Search = {
  all: null, kind: '', loading: false, timer: 0,

    const secs = S.provider.hasSections ? ['live', 'movie', 'series'] : ['live'];
    const res = await Promise.all(secs.map(sec => {
      const key = sec + ':*';
      return (S.cache[key] ? Promise.resolve(S.cache[key]) : S.provider.items(sec, null).then(l => S.cache[key] = l)).catch(() => []);
    }));
    this.all = res.flat();

    const words = q.split(/\s+/);
    const order = { live: 0, movie: 1, series: 2, episode: 3 };
    const res = this.all.filter(x => (!this.kind || x.kind === this.kind) && words.every(w => x.name.toLowerCase().includes(w)))
      .sort((a, b) => (b.name.toLowerCase().startsWith(words[0]) - a.name.toLowerCase().startsWith(words[0])) || order[a.kind] - order[b.kind])
      .slice(0, 300);

const QUALITY_CAPS = [[0, 'تلقائي (أفضل جودة متاحة)'], [2160, '4K كحد أقصى'], [1080, 'Full HD 1080p كحد أقصى'], [720, 'HD 720p كحد أقصى'], [480, '480p كحد أقصى (توفير نت)'], [360, '360p كحد أقصى']];

const Player = {
  list: [], idx: 0, hls: null, ts: null, tries: 0, triedHls: false, usingFallback: false, idleTimer: 0, saveTimer: 0, osdTimer: 0, zapTimer: 0, pending: -1,
  v: $('#video'),
  get it() { return this.list[this.idx]; },
  isLive() { return this.it && this.it.kind === 'live'; },
  open(list, idx, start = 'resume') {
    this.list = list; $('#player').hidden = false;

    refreshView();
  },
  stop() {
    if (this.hls) { this.hls.destroy(); this.hls = null; }

    this.v.removeAttribute('src'); this.v.load();
  },
  play(i, start = 'resume') {
    this.saveProgress();
    this.idx = i; const it = this.it;
    this.tries = 0; this.triedHls = false; this.usingFallback = false;
    $('#pTitle').textContent = it.name;
    $('#pSub').textContent = it.kind === 'live' ? '' : (it.seriesName || '');
    this.setCenter('loading');
    let pos = 0, resumed = false;
    if (start === 'resume') { const e = Lists.progress(it); if (it.kind !== 'live' && e && e.pos > 10 && pct(e) < 95) { pos = e.pos; resumed = true; } }
    else pos = +start || 0;
    this.osd(resumed ? 'متابعة من ' + fmtTime(pos) : (this.list.length > 1 ? `<span class="ch">${i + 1}</span>` + esc(it.name) : esc(it.name)));

  load(url, pos, forceHls) {
    this.stop();

(() => {

  let dragging = false;
  v.addEventListener('playing', () => { Player.setCenter(''); Player.updateRes(); $('#pPlay').textContent = '⏸'; });
  v.addEventListener('pause', () => { $('#pPlay').textContent = '▶'; Player.saveProgress(); Player.wake(); });

  seek.addEventListener('input', () => { dragging = true; $('#pTime').textContent = fmtTime(seek.value / 1000 * v.duration) + ' / ' + fmtTime(v.duration); });

    }
    let host = ''; try { host = new URL(/^https?:/i.test(url) ? url : 'http://' + url).host; } catch {}
    const s = { id: existing?.id || 's' + Date.now(), type, name: $('#f_name').value.trim() || host || 'سيرفر', url, user, pass, fmt };
    if (type === 'xtream') {
      status.hidden = false; status.textContent = 'جاري الاتصال بالسيرفر…';
      try { const ui = await Xtream(s).login(); status.textContent = 'تم الاتصال ✓ الحالة: ' + (ui.status || '—'); }
      catch (e) { status.textContent = 'تعذّر الاتصال: ' + e.message + ' — انحفظ السيرفر على أي حال.'; }
    }
    S.servers = [DEMO, ...S.servers.filter(x => x.id !== 'demo' && x.id !== s.id), s];
    LS.set('servers', S.servers.filter(x => x.id !== 'demo'));
    setTimeout(() => { closeModal(); selectServer(s.id); }, type === 'xtream' ? 900 : 0);
  }
}

/* =========================================================
   Keyboard / TV-remote navigation
   ========================================================= */
function spatial(dir) {
  const cur = document.activeElement;
  const scope = !$('#player').hidden ? $('#pSheet') : !$('#details').hidden ? $('#details') : !$('#search').hidden ? $('#search') : $('#modalRoot').firstChild || $('#app');
  const cands = [...scope.querySelectorAll('button:not([disabled]),[tabindex="0"],input,select')].filter(e => e.offsetParent !== null && e !== cur);
  if (!cur || cur === document.body || !scope.contains(cur)) { cands[0]?.focus(); return; }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bestD = Infinity;
  for (const e of cands) {
    const b = e.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2, dx = bx - ax, dy = by - ay;
    const ok = dir === 'up' ? dy < -4 : dir === 'down' ? dy > 4 : dir === 'left' ? dx < -4 : dx > 4;
    if (!ok) continue;
    const d = (dir === 'up' || dir === 'down') ? Math.abs(dy) + Math.abs(dx) * 2.5 : Math.abs(dx) + Math.abs(dy) * 2.5;
    if (d < bestD) { bestD = d; best = e; }
  }
  if (best) { best.focus(); best.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
}
document.addEventListener('keydown', e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName) && document.activeElement.type !== 'range';
  const inPlayer = !$('#player').hidden, sheetOpen = !$('#pSheet').hidden;
  if (e.key === 'Escape' || e.key === 'Backspace' && !typing) {
    if (document.querySelector('.menu')) return closeMenu();
    if ($('#modalRoot').firstChild) return closeModal();
    if (inPlayer) { e.preventDefault(); return sheetOpen ? Player.closeSheet() : Player.close(); }
    if (!$('#details').hidden) return Details.close();
    if (!$('#search').hidden) return Search.close();
    return;
  }
  if (typing && !['ArrowDown', 'ArrowUp'].includes(e.key)) return;
  const dirs = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  if (inPlayer && !sheetOpen) {
    const v = Player.v; Player.wake();
    const live = Player.isLive();
    switch (e.key) {
      case ' ': case 'k': e.preventDefault(); v.paused ? v.play() : v.pause(); return;
      case 'ArrowUp': e.preventDefault(); if (live) Player.zap(-1); return;
      case 'ArrowDown': e.preventDefault(); if (live) Player.zap(1); return;
      case 'ArrowLeft': e.preventDefault(); if (!live) v.currentTime += 10; return;   // RTL: left = forward
      case 'ArrowRight': e.preventDefault(); if (!live) v.currentTime -= 10; return;
      case 'Enter': if (document.activeElement === document.body || document.activeElement === v) { e.preventDefault(); live && Player.list.length > 1 ? Player.showList() : (v.paused ? v.play() : v.pause()); } return;
      case 'PageUp': case 'ChannelUp': Player.zap(1); return;
      case 'PageDown': case 'ChannelDown': Player.zap(-1); return;
      case 'm': case 'ContextMenu': e.preventDefault(); Player.showSettings(); return;
      case 'l': case 'e': Player.showList(); return;
      case 's': case 'c': Player.showSubs(); return;
      case 'z': Player.cycleFit(); return;
      case 'f': $('#pFull').click(); return;
      case 'n': Player.zap(1, true); return;
      case 'p': Player.zap(-1, true); return;
    }
    return;
  }
  if (dirs[e.key] && !(typing && e.key !== 'ArrowDown' && e.key !== 'ArrowUp')) { e.preventDefault(); spatial(dirs[e.key]); return; }
  if (e.key === '/' && !typing && $('#search').hidden && !inPlayer) { e.preventDefault(); Search.open(); }
});

/* =========================================================
   Boot
   ========================================================= */
$('#serverBtn').onclick = serversDialog;
$('#searchBtn').onclick = () => Search.open();
document.querySelectorAll('[data-close="search"]').forEach(b => b.onclick = () => Search.close());
$('#sortSel').value = String(S.sort);
$('#sortSel').onchange = e => { S.sort = +e.target.value; LS.set('sort', S.sort); if (current.sort) renderItems(current.list, current.empty, true); };
if (!window.Hls) toast('ما قدرت أحمّل مكتبة HLS. تأكد إنك متصل بالنت.');
selectServer(server().id);
</script>
