name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -z "$SIGNING_PASSWORD" ]; then echo "::warning::SIGNING_PASSWORD secret is not set - signing with a temporary debug key"; fi
          set -o pipefail
          ./gradlew assembleRelease --console=plain 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A2 build.log | head -60 | sed 's/^/::error::/' || true
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/*.apk Alsaif.apk
          cp Alsaif.apk TVPlayer.apk   # old download link keeps working
      - uses: actions/upload-artifact@v4
        with:
          name: Alsaif-apk
          path: Alsaif.apk
      # Direct download link: /releases/latest/download/TVPlayer.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Alsaif 1.${{ github.run_number }}
          make_latest: true
          files: |
            Alsaif.apk
            TVPlayer.apk
