name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk TVPlayer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TVPlayer-apk
          path: TVPlayer.apk
      # Direct download link: /releases/latest/download/TVPlayer.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV Player (build ${{ github.run_number }})
          make_latest: true
          files: TVPlayer.apk
