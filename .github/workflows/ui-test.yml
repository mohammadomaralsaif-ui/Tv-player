name: UI test on emulator

# Runs when a commit message contains [uitest]. Screenshots + log are published
# as a pre-release (never "latest", so the in-app updater ignores it).
on:
  push:

permissions:
  contents: write

jobs:
  uitest:
    if: contains(github.event.head_commit.message, '[uitest]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: chmod +x gradlew && ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.tvplayer.app.EpisodesUiTest com.tvplayer.app.test/androidx.test.runner.AndroidJUnitRunner > instrument.txt 2>&1 || true
            mkdir -p shots && adb pull /data/local/tmp/shots shots/ || true
            adb logcat -d > logcat.txt || true
      - name: Report crashes
        if: always()
        run: |
          cat instrument.txt || true
          grep -E "FATAL EXCEPTION|AndroidRuntime|ANR in|UITEST|Exception" -A3 logcat.txt | grep -v "^--$" | head -80 | sed 's/^/::warning::/' || true
          find shots -name '*.png' | sort
      - name: Publish screenshots
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: uitest-${{ github.run_number }}
          name: UI test ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: |
            shots/**/*.png
            logcat.txt
            instrument.txt
      - name: Fail on app crash
        run: |
          if grep -A1 "FATAL EXCEPTION" logcat.txt | grep -q "Process: com.tvplayer.app"; then echo "::error::App crashed during the UI test"; exit 1; fi
